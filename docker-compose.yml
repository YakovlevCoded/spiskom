services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: spiskom
      POSTGRES_PASSWORD: spiskom
      POSTGRES_DB: spiskom
    volumes:
      - spiskom-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spiskom -d spiskom"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  api:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://spiskom:spiskom@db:5432/spiskom?schema=public
      DIRECT_URL: postgresql://spiskom:spiskom@db:5432/spiskom?schema=public
      JWT_SECRET: local-development-secret-change-me-32-chars
      APP_URL: http://localhost:8080
      WEB_ORIGIN: http://localhost:8080
      COOKIE_SECURE: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: "Списком <no-reply@spiskom.local>"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  spiskom-db:
